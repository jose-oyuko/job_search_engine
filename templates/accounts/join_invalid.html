{% extends "public_base.html" %}
{% block title %}Invite not valid — {{ SITE_NAME }}{% endblock %}
{% block content %}
  <div class="mx-auto max-w-md px-4 py-16 text-center">
    <h1 class="text-2xl font-semibold tracking-tight">This invite cannot be used</h1>
    <p class="mt-3 text-slate-600">{{ error }}</p>
    <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
      <a href="{% url 'pages:landing' %}#request-invite" class="btn btn-primary">Request an invite</a>
      <a href="{% url 'account_login' %}" class="btn btn-secondary">Sign in</a>
    </div>
  </div>
{% endblock %}
