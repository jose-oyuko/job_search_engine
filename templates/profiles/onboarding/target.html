{% extends "onboarding_base.html" %}
{% block step_content %}
  <p class="text-sm text-slate-600">What kind of job are you after? This tells us which jobs to show you. You can add more targets later.</p>
  <form method="post" class="card mt-4 space-y-4" novalidate>
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <div class="flex flex-wrap gap-3">
      <button type="submit" class="btn btn-primary">Save and continue</button>
      <a href="{{ next_url }}" class="btn btn-secondary">Skip</a>
    </div>
  </form>
{% endblock %}
