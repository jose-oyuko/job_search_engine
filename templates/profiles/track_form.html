{% extends "app_base.html" %}
{% block title %}{% if track %}Edit track{% else %}New track{% endif %} &mdash; {{ SITE_NAME }}{% endblock %}
{% block content %}
  <h1 class="text-2xl font-semibold tracking-tight">{% if track %}Edit track{% else %}New track{% endif %}</h1>
  <form method="post" class="card mt-6 space-y-4" novalidate>
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <div class="flex flex-wrap gap-2">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'profiles:tracks' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
{% endblock %}
