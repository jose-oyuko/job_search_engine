{% if messages %}
  <ul class="space-y-2" role="status" aria-live="polite">
    {% for message in messages %}
      <li class="rounded-lg border px-4 py-3 text-sm
        {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800
        {% elif message.tags == 'success' %}border-green-200 bg-green-50 text-green-800
        {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
        {% else %}border-slate-200 bg-white text-slate-800{% endif %}">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}
