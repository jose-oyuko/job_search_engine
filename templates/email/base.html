<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ SITE_NAME }}</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;border:1px solid #e2e8f0;">
        <tr><td style="padding:24px 28px 0 28px;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;color:#4338ca;">{{ SITE_NAME }}</td></tr>
        <tr><td style="padding:16px 28px 28px 28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;color:#0f172a;">
          {% block body %}{% endblock %}
        </td></tr>
      </table>
      <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#64748b;margin:16px 0 0 0;">{{ COMPANY_NAME }} &middot; {{ CONTACT_EMAIL }}</p>
    </td></tr>
  </table>
</body>
</html>
