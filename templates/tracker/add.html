{% extends "app_base.html" %}
{% block title %}Add an application &mdash; {{ SITE_NAME }}{% endblock %}
{% block content %}
  <p class="text-sm"><a href="{% url 'tracker:board' %}" class="text-slate-600 underline">&larr; Tracker</a></p>
  <h1 class="mt-3 text-2xl font-semibold tracking-tight">Add an application</h1>
  <p class="mt-1 text-sm text-slate-600">For a job you found and applied to somewhere else.</p>
  <form method="post" class="card mt-4 space-y-4" novalidate>
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <button type="submit" class="btn btn-primary">Add to tracker</button>
  </form>
{% endblock %}
