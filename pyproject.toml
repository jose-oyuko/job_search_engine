[project]
name = "jobpilot"
version = "0.0.0"
description = "JobPilot: finds jobs, matches them to your profile, and generates application kits."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<6.0",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "huey>=2.5",
    "whitenoise>=6.7",
    "gunicorn>=22.0",
    "nh3>=0.2.18",
    "httpx>=0.27",
    "pydantic>=2.8",
    "sentry-sdk>=2.0",
    "django-allauth[socialaccount]>=65",
    "django-ratelimit>=4.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "tzdata>=2026.5",
    "selectolax>=1.0.2",
    "defusedxml>=0.7.1",
    "certifi>=2026.10.19",
    "weasyprint>=70.0",
    "docxtpl>=0.20.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "respx>=0.21",
    "time-machine>=2.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "django-debug-toolbar>=4.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests keep long asserts and inline literals readable; line length is enforced on app code.
"tests/**" = ["S101", "S104", "S105", "S106", "E501"]
"**/tests/**" = ["S101", "S104", "S105", "S106", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "jobpilot"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "jobpilot.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["apps", "jobpilot"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "jobpilot.settings.test"

# Strict on business-logic modules (spec §21).
[[tool.mypy.overrides]]
module = ["apps.*.services", "apps.*.rules", "apps.*.pay", "apps.*.eligibility", "apps.*.validation"]
# `strict = true` is not valid in a per-module override, so the strict flags are spelled out.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# factory-boy is untyped, so every factory call in tests looks like a type error; the tests
# still run under pytest, and mypy's value is in application code.
[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
ignore_errors = true
